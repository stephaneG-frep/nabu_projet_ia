name: nabu_projet_ia
description: "NabuProjet IA - Chef de projet personnel propulsé par l'intelligence artificielle"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # UI
  flutter_animate: ^4.5.2

  # Date/Time
  intl: ^0.19.0

  # PDF Export
  pdf: ^3.11.2
  printing: ^5.13.4

  # HTTP for AI APIs
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
