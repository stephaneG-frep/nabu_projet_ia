name: nabu_projet_ia
description: "NabuProjet IA - Chef de projet personnel propulsé par l'intelligence artificielle"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  cached_network_image: ^3.4.1
  
  # Navigation
  go_router: ^14.8.1
  
  # Date/Time
  intl: ^0.19.0
  
  # PDF Export
  pdf: ^3.11.2
  printing: ^5.13.4
  path_provider: ^2.1.5
  
  # HTTP for AI APIs
  http: ^1.2.2
  dio: ^5.7.0
  
  # Utils
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
